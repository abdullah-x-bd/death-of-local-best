name: Reconstruct NTIA application structure

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ntia-application-structure.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: causal-architecture-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas requests xlrd

      - name: Reconstruct sanitized application structure
        run: |
          python analysis/08_ntia_application_structure.py \
            --outdir data/derived/ntia_applications
          cat data/derived/ntia_applications/structure_qa.json

      - name: Persist derived application structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/ntia_applications
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Persist sanitized NTIA application structure"
            git push origin HEAD:causal-architecture-v1
          fi
