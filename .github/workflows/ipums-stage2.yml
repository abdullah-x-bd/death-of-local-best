name: Run IPUMS USA Stage 2 Local Markets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ipums-stage2.yml"

permissions:
  contents: read

jobs:
  local-markets:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: causal-architecture-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: python -m pip install "huggingface_hub>=0.35.0"

      - name: Download private IPUMS data and DDI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_XET_HIGH_PERFORMANCE: "1"
        run: |
          mkdir -p data/private/ipums_usa
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          repo="abdkul/death-of-local-best-private-data"
          for filename in ["usa_00001.dat.gz","usa_00001.xml"]:
              hf_hub_download(
                  repo_id=repo,
                  repo_type="dataset",
                  filename=filename,
                  token=os.environ["HF_TOKEN"],
                  local_dir="data/private/ipums_usa",
              )
          PY

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("curl","httr","ipumsr","data.table","haven"), repos=Sys.getenv("RSPM"))'

      - name: Construct local-market concentration outcomes
        run: |
          mkdir -p outputs/ipums_stage2
          Rscript analysis/02_ipums_local_market_panel.R \
            data/private/ipums_usa/usa_00001.xml \
            data/private/ipums_usa/usa_00001.dat.gz \
            outputs/ipums_stage2

      - name: Inspect output
        run: |
          find outputs/ipums_stage2 -maxdepth 1 -type f -printf "%f %s bytes\n"
          head -n 20 outputs/ipums_stage2/local_market_qa.csv
          head -n 10 outputs/ipums_stage2/occupation_geographic_concentration.csv

      - name: Upload derived concentration outcomes
        uses: actions/upload-artifact@v4
        with:
          name: ipums-usa-stage2-local-markets
          path: |
            outputs/ipums_stage2/occupation_geographic_concentration.csv
            outputs/ipums_stage2/local_market_qa.csv
          retention-days: 30
          if-no-files-found: error
