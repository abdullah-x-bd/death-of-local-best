name: Run IPUMS USA Stage 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ipums-stage1.yml"

permissions:
  contents: read

jobs:
  ipums-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: causal-architecture-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: python -m pip install "huggingface_hub>=0.35.0"

      - name: Download private IPUMS extract
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_XET_HIGH_PERFORMANCE: "1"
        run: |
          mkdir -p data/private/ipums_usa
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          repo = "abdkul/death-of-local-best-private-data"
          token = os.environ["HF_TOKEN"]
          files = [
              "usa_00001.dat.gz",
              "usa_00001.xml",
              "usa_00001.R",
              "usa_00001.cbk",
          ]
          for filename in files:
              path = hf_hub_download(
                  repo_id=repo,
                  repo_type="dataset",
                  filename=filename,
                  token=token,
                  local_dir="data/private/ipums_usa",
              )
              print(filename, "->", path)
          PY
          ls -lh data/private/ipums_usa

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("ipumsr","data.table","haven","jsonlite"), repos="https://cloud.r-project.org")'

      - name: Run streaming IPUMS ingestion
        run: |
          mkdir -p outputs/ipums_stage1
          Rscript analysis/01_ipums_stage1.R \
            data/private/ipums_usa/usa_00001.xml \
            data/private/ipums_usa/usa_00001.dat.gz \
            outputs/ipums_stage1

      - name: Inspect outputs
        run: |
          find outputs/ipums_stage1 -maxdepth 1 -type f -printf "%f %s bytes\n"
          echo "---- QA REPORT ----"
          cat outputs/ipums_stage1/qa_report.json

      - name: Upload derived Stage 1 outputs
        uses: actions/upload-artifact@v4
        with:
          name: ipums-usa-stage1-derived
          path: outputs/ipums_stage1/
          retention-days: 30
          if-no-files-found: error
