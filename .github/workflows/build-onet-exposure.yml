name: Build frozen O*NET exposure layer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-onet-exposure.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: causal-architecture-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas requests xlrd lxml

      - name: Build frozen exposure and crosswalk layer
        run: |
          python analysis/05_build_onet_occ2010_exposure.py \
            --stage2 data/derived/ipums_stage2/occupation_geographic_concentration.csv \
            --outdir data/derived/onet_exposure_v0
          cat data/derived/onet_exposure_v0/qa.json

      - name: Persist derived exposure outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived/onet_exposure_v0
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Persist frozen O*NET exposure and OCC2010 crosswalk"
            git push origin HEAD:causal-architecture-v1
          fi
