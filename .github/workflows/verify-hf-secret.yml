name: Verify HF private dataset

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-hf-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify private dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN secret is missing")
          req = urllib.request.Request(
              "https://huggingface.co/api/datasets/abdkul/death-of-local-best-private-data/tree/main?recursive=false&expand=false",
              headers={"Authorization": "Bearer " + token}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          names = [x.get("path") for x in data if x.get("path")]
          print("Private Hugging Face access OK")
          for n in names:
              print("FILE", n)
          if not any(str(n).endswith(".dat.gz") for n in names):
              raise SystemExit("Missing .dat.gz")
          if not any(str(n).endswith(".xml") for n in names):
              raise SystemExit("Missing .xml")
          PY
