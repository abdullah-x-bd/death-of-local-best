name: Bootstrap public research data

on:
  workflow_dispatch:
  push:
    branches:
      - causal-architecture-v1
    paths:
      - ".github/workflows/bootstrap-public-data.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Download public core
        run: |
          python scripts/fetch_public_data.py \
            --root public-data-core \
            --manifest public-data-core/manifest.json \
            --sources onet oews cbp nonemployer ntia ofcom

      - name: Bundle release assets
        run: |
          mkdir -p release-assets
          for src in onet oews cbp nonemployer ntia ofcom; do
            tar -C public-data-core -czf "release-assets/${src}.tar.gz" "${src}"
          done
          cp public-data-core/manifest.json release-assets/manifest.json
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Freeze in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="public-data-core-v0.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Public data core v0.1" \
              --notes "Frozen public raw-data snapshots for the causal market-shelter project. Exact SHA-256 values are included."
          fi
